server {
  # PORT e API_UPSTREAM vêm do ambiente (nginx substitui ao iniciar; ver apps/web/Dockerfile)
  listen ${PORT};
  listen [::]:${PORT};
  root /usr/share/nginx/html;
  index index.html;

  # Resolve o endereço da API a cada 10 s (em vez de só ao iniciar): quando a API é
  # publicada de novo ela muda de IP. NGINX_LOCAL_RESOLVERS vem do /etc/resolv.conf.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=on;

  # API (mesmo domínio: evita CORS)
  location /api/ {
    set $api_upstream ${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: todas as rotas caem no index.html
  location / {
    try_files $uri /index.html;
  }
}
