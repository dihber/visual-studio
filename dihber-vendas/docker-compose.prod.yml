# Produção (exemplo). Coloque um proxy com HTTPS (Caddy, Traefik, Nginx + Certbot) na frente do "web".
#   JWT_SECRET=$(openssl rand -hex 32) POSTGRES_PASSWORD=... docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dihber
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: dihber_vendas
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on: [postgres]
    environment:
      DATABASE_URL: postgresql://dihber:${POSTGRES_PASSWORD}@postgres:5432/dihber_vendas?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PORT: 3333
    ports:
      - '3333:3333' # acesso direto do app (ou use o mesmo domínio via /api do web)

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    depends_on: [api]
    ports:
      - '80:80'

volumes:
  pgdata:
